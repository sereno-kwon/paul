<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Paul Component Korea</title>
<meta name="robots" content="noindex">
<script>
  // 하위 주소(/klamper, /en/racer ...)를 원페이지 섹션으로 연결
  // github.io 미리보기(/paul/)와 자체 도메인(/) 모두 동작
  var base = location.hostname.slice(-10) === 'github.io' ? '/paul/' : '/';
  var parts = location.pathname.slice(base.length).replace(/\/$/, '').toLowerCase().split('/');
  var lang = (parts[0] === 'en' || parts[0] === 'ja') ? parts.shift() + '/' : '';
  var key = parts.join('/');
  var alias = { 'disc':'klamper', 'disc-brake':'klamper', 'flat-mount':'klamper', 'post-mount':'klamper', 'klampers':'klamper',
                'rim-brakes':'brakes', 'brake':'brakes', 'neo-retro':'brakes', 'neoretro':'brakes', 'touring':'brakes', 'cantilever':'brakes', 'canti':'brakes',
                'racer':'brakes', 'racer-medium':'brakes', 'centerpull':'brakes', 'minimoto':'brakes', 'motolite':'brakes',
                'lever':'levers', 'canti-lever':'levers', 'love-lever':'levers', 'duplex':'levers', 'cross-lever':'levers', 'reverse-lever':'levers', 'e-lever':'levers',
                'boxcar':'cockpit', 'stem':'cockpit', 'seatpost':'cockpit', 'seatposts':'cockpit', 'tall-and-handsome':'cockpit', 'tall-and-elegant':'cockpit', 'collar':'cockpit',
                'hub':'hubs', 'word':'hubs', 'disk-word':'hubs', 'fhub':'hubs', 'high-flange':'hubs', 'cranks':'hubs', 'crank':'hubs', 'thumbies':'hubs', 'melvin':'hubs', 'drivetrain':'hubs',
                'compatibility':'fit', 'fit-guide':'fit', 'about':'brand', 'history':'story', 'contact':'showroom', 'dealer':'dealers', 'lineup':'range' };
  var map = { brand:1, range:1, klamper:1, brakes:1, levers:1, cockpit:1, hubs:1, fit:1, story:1, showroom:1, dealers:1 };
  key = alias[key] || key;
  location.replace(base + lang + (map[key] ? '#' + key : ''));
</script>
<style>body{background:#fff}@media (prefers-color-scheme:dark){body{background:#101114}}</style>
</head>
<body></body>
</html>
